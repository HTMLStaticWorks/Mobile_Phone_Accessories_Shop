<script>
    (function() {
        // Shared Theme Manager
        const themeToggle = document.getElementById('theme-toggle') || document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // Init theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            html.classList.add('dark');
            html.classList.remove('light');
        } else if (savedTheme === 'light') {
            html.classList.add('light');
            html.classList.remove('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark');
        }

        function updateIcon() {
            if (!themeToggle) return;
            const spans = themeToggle.querySelectorAll('span');
            if (html.classList.contains('dark')) {
                if (spans.length === 1) spans[0].textContent = 'light_mode';
                else if (spans.length === 2) { spans[0].classList.add('hidden'); spans[1].classList.remove('hidden'); }
            } else {
                if (spans.length === 1) spans[0].textContent = 'dark_mode';
                else if (spans.length === 2) { spans[0].classList.remove('hidden'); spans[1].classList.add('hidden'); }
            }
        }
        
        updateIcon();

        if (themeToggle) {
            // Remove existing listeners if this is re-executed (though shouldn't happen)
            const newToggle = themeToggle.cloneNode(true);
            if (themeToggle.parentNode) {
                themeToggle.parentNode.replaceChild(newToggle, themeToggle);
            }
            newToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                
                // Keep the icon logic up to date
                const spans = newToggle.querySelectorAll('span');
                if (html.classList.contains('dark')) {
                    if (spans.length === 1) spans[0].textContent = 'light_mode';
                    else if (spans.length === 2) { spans[0].classList.add('hidden'); spans[1].classList.remove('hidden'); }
                } else {
                    if (spans.length === 1) spans[0].textContent = 'dark_mode';
                    else if (spans.length === 2) { spans[0].classList.remove('hidden'); spans[1].classList.add('hidden'); }
                }
            });
        }
    })();
</script>


<script>
    // Global Scroll Animation Observer (Updated)
    document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Standard visibility classes
                    entry.target.classList.add('visible', 'is-visible', 'active');
                    
                    // Remove hidden states
                    entry.target.classList.remove('opacity-0', 'hidden-anim');
                    
                    // Add animation class if it's a scroll-anim
                    if (entry.target.classList.contains('scroll-anim')) {
                        entry.target.classList.add('animate-fade-in-up');
                    }
                    
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Select all elements that require scroll animation
        const animatedElements = document.querySelectorAll('.fade-in-up, .slide-up, .zoom-in, .animate-fade-in-up, .pop-icon, .scroll-anim, .reveal, .hidden-anim');
        animatedElements.forEach(el => observer.observe(el));
    });
</script>


<script>
    // Keep mobile theme icon in sync
    document.addEventListener('click', (e) => {
        if (e.target.closest('#themeToggle') || e.target.closest('.theme-icon-mobile')) {
            setTimeout(() => {
                const mobileIcon = document.querySelector('.theme-icon-mobile');
                const htmlClasses = document.documentElement.classList;
                if (mobileIcon) {
                    mobileIcon.textContent = htmlClasses.contains('dark') ? 'light_mode' : 'dark_mode';
                }
            }, 50);
        }
    });
