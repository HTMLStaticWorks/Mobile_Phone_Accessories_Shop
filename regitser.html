<script>
    (function() {
        // Shared Theme Manager
        const themeToggle = document.getElementById('theme-toggle') || document.getElementById('themeToggle');
        const html = document.documentElement;
        
        
        // Init dir
        const savedDir = localStorage.getItem('dir');
        if (savedDir) {
            document.documentElement.dir = savedDir;
        }

        // Init theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            html.classList.add('dark');
            html.classList.remove('light');
        } else if (savedTheme === 'light') {
            html.classList.add('light');
            html.classList.remove('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark');
        }

        function updateIcon() {
            if (!themeToggle) return;
            const spans = themeToggle.querySelectorAll('span');
            if (html.classList.contains('dark')) {
                if (spans.length === 1) spans[0].textContent = 'light_mode';
                else if (spans.length === 2) { spans[0].classList.add('hidden'); spans[1].classList.remove('hidden'); }
            } else {
                if (spans.length === 1) spans[0].textContent = 'dark_mode';
                else if (spans.length === 2) { spans[0].classList.remove('hidden'); spans[1].classList.add('hidden'); }
            }
        }
        
        updateIcon();

        if (themeToggle) {
            // Remove existing listeners if this is re-executed (though shouldn't happen)
            const newToggle = themeToggle.cloneNode(true);
            if (themeToggle.parentNode) {
                themeToggle.parentNode.replaceChild(newToggle, themeToggle);
            }
            newToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                
                // Keep the icon logic up to date
                const spans = newToggle.querySelectorAll('span');
                if (html.classList.contains('dark')) {
                    if (spans.length === 1) spans[0].textContent = 'light_mode';
                    else if (spans.length === 2) { spans[0].classList.add('hidden'); spans[1].classList.remove('hidden'); }
                } else {
                    if (spans.length === 1) spans[0].textContent = 'dark_mode';
                    else if (spans.length === 2) { spans[0].classList.remove('hidden'); spans[1].classList.add('hidden'); }
                }
            });
        }
    })();
</script>


<script>
    // Global Scroll Animation Observer (Updated)
    document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Standard visibility classes
                    entry.target.classList.add('visible', 'is-visible', 'active');
                    
                    // Remove hidden states
                    entry.target.classList.remove('opacity-0', 'hidden-anim');
                    
                    // Add animation class if it's a scroll-anim
                    if (entry.target.classList.contains('scroll-anim')) {
                        entry.target.classList.add('animate-fade-in-up');
                    }
                    
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Select all elements that require scroll animation
        const animatedElements = document.querySelectorAll('.fade-in-up, .slide-up, .zoom-in, .animate-fade-in-up, .pop-icon, .scroll-anim, .reveal, .hidden-anim');
        animatedElements.forEach(el => observer.observe(el));
    });
</script>


<script>

    document.addEventListener('click', (e) => {

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cartBtns = document.querySelectorAll('button[aria-label="shopping_cart"]');
        const cartSidebar = document.getElementById('cart-sidebar');
        const cartBackdrop = document.getElementById('cart-backdrop');
        const cartPanel = document.getElementById('cart-panel');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const continueShoppingBtn = document.getElementById('continue-shopping-btn');

        function openCart() {
            if(!cartSidebar) return;
            cartSidebar.classList.remove('hidden');
            // Small delay to allow display:block to apply before animation
            setTimeout(() => {
                cartBackdrop.classList.remove('opacity-0');
                cartPanel.classList.remove('translate-x-full');
            }, 10);
        }

        function closeCart() {
            if(!cartSidebar) return;
            cartBackdrop.classList.add('opacity-0');
            cartPanel.classList.add('translate-x-full');
            setTimeout(() => {
                cartSidebar.classList.add('hidden');
            }, 300); // match duration-300
        }

        cartBtns.forEach(btn => btn.addEventListener('click', openCart));
        if (closeCartBtn) closeCartBtn.addEventListener('click', closeCart);
        if (cartBackdrop) cartBackdrop.addEventListener('click', closeCart);
        if (continueShoppingBtn) continueShoppingBtn.addEventListener('click', closeCart);
    });
</script>
